[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d1-fast-cuda"
version = "0.1.0"
description = "Fast CUDA inference for LiquidAI d1-3B and d1-2B decision models, on Windows and Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LFM Open License v1.0 (code derived from the d1 checkpoints); see LICENSES/ and NOTICE" }
dependencies = [
    "torch>=2.9",
    "transformers>=5.19",
    "pillow",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]
compile = ["triton-windows; platform_system == 'Windows'"]
fp8 = ["triton-windows; platform_system == 'Windows'"]

[tool.setuptools.packages.find]
include = ["d1_fast_cuda*"]

[tool.setuptools.package-data]
d1_fast_cuda = ["fp8_table.json", "csrc/*.cu"]
